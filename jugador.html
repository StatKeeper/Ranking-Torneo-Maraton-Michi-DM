<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Perfil y Comparativa de jugadores — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">

<!-- Configuración PWA e Ícono de Inicio -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f8f6f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  .grid-companeros {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 14px;
  }
  .tabla-companeros {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    background: var(--panel);
  }
  .tabla-companeros th, .tabla-companeros td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .tabla-companeros th {
    background: var(--panel-raised);
    color: var(--gold);
    font-weight: 600;
    font-size: 0.75rem;
  }
  .tabla-companeros td.num {
    text-align: center;
  }
  .tabla-companeros td.wr {
    text-align: right;
    font-weight: 600;
    color: var(--win);
  }
  .comparativa-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 16px;
  }
  .tarjeta-comparacion {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .comparacion-inputs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WNLR39PS"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header class="topbar">
  <div class="brand">
    <span class="sub">Jugadores y Comparativa</span>
  </div>
  <nav class="tabs">
    <a href="index.html">Inicio</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="jugador.html" class="active">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="panel" id="buscador">
    <h3>Selecciona de 1 a 4 jugadores</h3>
    <p class="hint">Deja las casillas vacías las que no vayas a usar si solo quieres ver a 1 o 2 jugadores.</p>
    <div class="comparacion-inputs">
      <input type="text" id="input-j1" list="lista-nombres" placeholder="Jugador 1">
      <input type="text" id="input-j2" list="lista-nombres" placeholder="Jugador 2 (opc.)">
      <input type="text" id="input-j3" list="lista-nombres" placeholder="Jugador 3 (opc.)">
      <input type="text" id="input-j4" list="lista-nombres" placeholder="Jugador 4 (opc.)">
    </div>
    <button class="btn" onclick="ejecutarConsultaJugadores()">Consultar</button>
    <datalist id="lista-nombres"></datalist>
  </div>

  <div class="filters">
    <select id="filtro-anio"></select>
    <select id="filtro-mes"></select>
  </div>

  <div id="contenido-perfil"></div>
  <button id="btn-descargar-perfil" class="btn secondary" style="display:none; margin-top:12px;" onclick="descargarImagenPerfil()">📷 Descargar Imagen</button>
</main>

<nav class="mobile-nav">
  <a href="index.html"><span class="icon">🏠</span>Inicio</a>
  <a href="clasificacion.html"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html" class="active"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
let PARTIDAS = [];
let EQUIVALENCIAS = [];
let JUGADORES_INFO = {};

function partidasFiltradas() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  return PARTIDAS.filter(p =>
    (anio === "" || p.anio == anio) &&
    (mes === "" || String(p.mes).padStart(2, "0") === mes)
  );
}

function poblarFiltrosPeriodo() {
  const anios = [...new Set(PARTIDAS.map(p => p.anio))].sort((a, b) => b - a);
  const selAnio = document.getElementById("filtro-anio");
  selAnio.innerHTML = `<option value="">Todos los años</option>` + anios.map(a => `<option value="${a}">${a}</option>`).join("");

  const meses = [...new Set(PARTIDAS.map(p => String(p.mes).padStart(2, "0")))].sort();
  const selMes = document.getElementById("filtro-mes");
  selMes.innerHTML = `<option value="">Todos los meses</option>` + meses.map(m => `<option value="${m}">${NOMBRES_MES[m]}</option>`).join("");

  selAnio.addEventListener("change", repetirConsultaActual);
  selMes.addEventListener("change", repetirConsultaActual);
}

function repetirConsultaActual() {
  const j1 = document.getElementById("input-j1").value.trim();
  if (j1) ejecutarConsultaJugadores();
}

function ejecutarConsultaJugadores() {
  const nombres = [
    document.getElementById("input-j1").value.trim(),
    document.getElementById("input-j2").value.trim(),
    document.getElementById("input-j3").value.trim(),
    document.getElementById("input-j4").value.trim()
  ].filter(n => n !== "");

  if (nombres.length === 0) {
    document.getElementById("contenido-perfil").innerHTML = `<div class="empty-state">Por favor, ingresa al menos un jugador en el Jugador 1.</div>`;
    document.getElementById("btn-descargar-perfil").style.display = "none";
    return;
  }

  if (nombres.length === 1) {
    pintarPerfilIndividual(nombres[0]);
  } else {
    pintarComparativaVertical(nombres);
  }
}

function pintarPerfilIndividual(nombre) {
  const cont = document.getElementById("contenido-perfil");
  const partidasActivas = partidasFiltradas();
  const totalPartidasGlobales = partidasActivas.length;
  const statsMap = calcularEstadisticasJugadores(partidasActivas, EQUIVALENCIAS);
  const stats = statsMap[nombre];

  if (!stats) {
    cont.innerHTML = `<div class="empty-state">No se encontraron partidas para "${nombre}" en este período.</div>`;
    document.getElementById("btn-descargar-perfil").style.display = "none";
    return;
  }

  const winRate = stats.partidas > 0 ? Math.round((stats.victorias / stats.partidas) * 100) : 0;
  const porcentajeParticipacion = totalPartidasGlobales > 0 ? Math.round((stats.partidas / totalPartidasGlobales) * 100) : 0;
  const promTiempo = stats.partidas > 0 ? Math.round(stats.segundosTotales / stats.partidas) : 0;
  const inicial = stats.nombre.replace(/\[.*?\]/g, "").trim().charAt(0).toUpperCase() || "?";
  const info = JUGADORES_INFO[stats.nombre] || {};
  const codigoPais = info.pais;
  const civFavorita = info.civFavorita;
  const contenidoAvatar = codigoPais
    ? `<img src="https://flagcdn.com/w160/${codigoPais.toLowerCase()}.png" alt="${codigoPais}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`
    : inicial;

  const civsOrdenadas = Object.entries(stats.civs).sort((a, b) => b[1].jugadas - a[1].jugadas);
  const maxJugadas = civsOrdenadas.length ? civsOrdenadas[0][1].jugadas : 1;

  const { aliados, adversarios } = calcularCompanerosYRivales(stats.nombre, partidasActivas, EQUIVALENCIAS);

  cont.innerHTML = `
    <div class="profile-header">
      <div class="avatar" style="${codigoPais ? 'overflow:hidden; padding:0;' : ''}">${contenidoAvatar}</div>
      <div>
        <h1>${stats.nombre}</h1>
        <div class="tagline">${stats.partidas} partidas jugadas · ${winRate}% victorias${civFavorita ? ` · ⭐ Favorita: ${civFavorita}` : ""}</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-tile"><span class="num">${stats.puntos}</span><span class="label">Puntos</span></div>
      <div class="stat-tile"><span class="num">${stats.victorias}</span><span class="label">Victorias</span></div>
      <div class="stat-tile"><span class="num">${stats.derrotas}</span><span class="label">Derrotas</span></div>
      <div class="stat-tile"><span class="num" style="color:var(--patina-bright);">${porcentajeParticipacion}%</span><span class="label">Participación Ranking Maratón Michi DM</span></div>
      <div class="stat-tile"><span class="num">${formatearDuracion(stats.segundosTotales)}</span><span class="label">Tiempo Total</span></div>
      <div class="stat-tile"><span class="num">${formatearDuracion(promTiempo)}</span><span class="label">Promedio Tiempo Total</span></div>
      <div class="stat-tile"><span class="num">${stats.unidadesAsesinadas}</span><span class="label">Unidades Asesinadas</span></div>
      <div class="stat-tile"><span class="num">${Math.round(stats.unidadesAsesinadas / stats.partidas) || 0}</span><span class="label">Promedio Unidades Asesinadas</span></div>
      <div class="stat-tile"><span class="num">${stats.edificiosArrasados}</span><span class="label">Edificios Arrasados</span></div>
      <div class="stat-tile"><span class="num">${Math.round(stats.edificiosArrasados / stats.partidas) || 0}</span><span class="label">Promedio Edificios Arrasados</span></div>
    </div>

    <div class="section-head"><h2>Civilizaciones más jugadas</h2></div>
    <div class="breakdown-list">
      ${civsOrdenadas.length === 0 ? `<div class="empty-state">Sin datos de civilización.</div>` : civsOrdenadas.map(([civ, d]) => {
        const wr = Math.round((d.victorias / d.jugadas) * 100);
        const pctUso = Math.round((d.jugadas / stats.partidas) * 100);
        const ancho = Math.round((d.jugadas / maxJugadas) * 100);
        return `
          <div class="breakdown-row">
            <span>${civ}</span>
            <span>${d.jugadas}p (${pctUso}%)</span>
            <span class="wr">${wr}% WR</span>
            <div class="bar-track"><div class="bar-fill" style="width:${ancho}%"></div></div>
          </div>
        `;
      }).join("")}
    </div>

    <div class="section-head" style="margin-top:24px;"><h2>Compañeros y Rivales</h2></div>
    <div class="grid-companeros">
      <div class="panel" style="padding:10px;">
        <h3 style="font-size:0.88rem; color:var(--gold); margin-bottom:8px;">🤝 Aliados</h3>
        ${aliados.length === 0 ? `<div class="empty-state">Sin partidas en equipo.</div>` : `
          <table class="tabla-companeros">
            <thead>
              <tr>
                <th>Aliado</th>
                <th class="num">PJ</th>
                <th style="text-align:right;">% Vic.</th>
              </tr>
            </thead>
            <tbody>
              ${aliados.map(a => `
                <tr>
                  <td>${a.nombre}</td>
                  <td class="num">${a.partidas}</td>
                  <td class="wr">${a.wr}%</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `}
      </div>

      <div class="panel" style="padding:10px;">
        <h3 style="font-size:0.88rem; color:var(--loss); margin-bottom:8px;">⚔️ Adversarios</h3>
        ${adversarios.length === 0 ? `<div class="empty-state">Sin enfrentamientos directos.</div>` : `
          <table class="tabla-companeros">
            <thead>
              <tr>
                <th>Adversario</th>
                <th class="num">PJ</th>
                <th style="text-align:right;">% Vic.</th>
              </tr>
            </thead>
            <tbody>
              ${adversarios.map(adv => `
                <tr>
                  <td>${adv.nombre}</td>
                  <td class="num">${adv.partidas}</td>
                  <td class="wr">${adv.wr}%</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `}
      </div>
    </div>
  `;
  document.getElementById("btn-descargar-perfil").style.display = "inline-block";
}

function pintarComparativaVertical(nombres) {
  const cont = document.getElementById("contenido-perfil");
  const partidasActivas = partidasFiltradas();
  const totalPartidasGlobales = partidasActivas.length;
  const statsMap = calcularEstadisticasJugadores(partidasActivas, EQUIVALENCIAS);

  let htmlCards = `<div class="comparativa-container">`;

  nombres.forEach(nombre => {
    const stats = statsMap[nombre];
    if (!stats) {
      htmlCards += `
        <div class="tarjeta-comparacion">
          <h3 style="color:var(--loss);">${nombre}</h3>
          <p class="empty-state" style="padding:10px 0;">No se encontraron datos en este período.</p>
        </div>`;
      return;
    }

    const winRate = stats.partidas > 0 ? Math.round((stats.victorias / stats.partidas) * 100) : 0;
    const porcentajeParticipacion = totalPartidasGlobales > 0 ? Math.round((stats.partidas / totalPartidasGlobales) * 100) : 0;
    const promTiempo = stats.partidas > 0 ? Math.round(stats.segundosTotales / stats.partidas) : 0;
    const inicial = stats.nombre.replace(/\[.*?\]/g, "").trim().charAt(0).toUpperCase() || "?";
    const info = JUGADORES_INFO[stats.nombre] || {};
    const codigoPais = info.pais;
    const contenidoAvatar = codigoPais
      ? `<img src="https://flagcdn.com/w160/${codigoPais.toLowerCase()}.png" alt="${codigoPais}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`
      : inicial;

    htmlCards += `
      <div class="tarjeta-comparacion">
        <div class="profile-header" style="margin-bottom:12px; padding-bottom:10px;">
          <div class="avatar" style="width:44px; height:44px; font-size:1.1rem; ${codigoPais ? 'overflow:hidden; padding:0;' : ''}">${contenidoAvatar}</div>
          <div>
            <h1 style="font-size:1.15rem;">${stats.nombre}</h1>
            <div class="tagline">${stats.partidas} partidas · ${winRate}% victorias</div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-tile"><span class="num">${stats.puntos}</span><span class="label">Puntos</span></div>
          <div class="stat-tile"><span class="num">${stats.victorias}</span><span class="label">Victorias</span></div>
          <div class="stat-tile"><span class="num">${stats.derrotas}</span><span class="label">Derrotas</span></div>
          <div class="stat-tile"><span class="num" style="color:var(--patina-bright);">${porcentajeParticipacion}%</span><span class="label">Participación Michi</span></div>
          <div class="stat-tile"><span class="num">${formatearDuracion(stats.segundosTotales)}</span><span class="label">Tiempo Total</span></div>
          <div class="stat-tile"><span class="num">${formatearDuracion(promTiempo)}</span><span class="label">Prom. Tiempo</span></div>
          <div class="stat-tile"><span class="num">${stats.unidadesAsesinadas}</span><span class="label">Unid. Asesinadas</span></div>
          <div class="stat-tile"><span class="num">${stats.edificiosArrasados}</span><span class="label">Edificios Arrasados</span></div>
        </div>
      </div>
    `;
  });

  htmlCards += `</div>`;
  cont.innerHTML = htmlCards;
  document.getElementById("btn-descargar-perfil").style.display = "inline-block";
}

function poblarBuscador() {
  const stats = calcularEstadisticasJugadores(PARTIDAS, EQUIVALENCIAS);
  const nombres = Object.keys(stats).sort();
  document.getElementById("lista-nombres").innerHTML =
    nombres.map(n => `<option value="${n}">`).join("");

  poblarFiltrosPeriodo();

  const params = new URLSearchParams(window.location.search);
  const nombreURL = params.get("nombre");
  if (nombreURL && stats[nombreURL]) {
    document.getElementById("input-j1").value = nombreURL;
    pintarPerfilIndividual(nombreURL);
  } else {
    document.getElementById("contenido-perfil").innerHTML =
      `<div class="empty-state">Ingresa al menos un jugador arriba y presiona "Consultar".</div>`;
    document.getElementById("btn-descargar-perfil").style.display = "none";
  }
}

function descargarImagenPerfil() {
  const el = document.getElementById("contenido-perfil");
  descargarElementoComoImagen(el, "comparativa-jugadores.png", "#f8f6f0");
}

(async function init() {
  const datos = await cargarDatos();
  PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  JUGADORES_INFO = datos.jugadoresInfo || {};
  poblarBuscador();
})();
</script>
</body>
</html>
