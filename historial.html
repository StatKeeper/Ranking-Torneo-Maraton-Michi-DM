<script src="js/datos.js"></script>
<script>
const LIMITE_PARTIDAS_DEFAULT = 10;
let PARTIDAS = [], EQUIVALENCIAS = [];

function poblarFiltros() {
  const anios = [...new Set(PARTIDAS.map(p => p.anio))].sort((a, b) => b - a);
  const selAnio = document.getElementById("filtro-anio");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const txtSinDatos = idiomaActual === 'en' ? 'No data' : 'Sin datos';

  selAnio.innerHTML = anios.length ? anios.map(a => `<option value="${a}">${a}</option>`).join("") : `<option value="">${txtSinDatos}</option>`;
  selAnio.addEventListener("change", () => { poblarMeses(); poblarJornadas(); render(); });
  poblarMeses();
  document.getElementById("filtro-mes").addEventListener("change", () => { poblarJornadas(); render(); });
  document.getElementById("filtro-jornada").addEventListener("change", render);
}

function poblarMeses() {
  const anio = document.getElementById("filtro-anio").value;
  const meses = [...new Set(PARTIDAS.filter(p => p.anio == anio).map(p => String(p.mes).padStart(2, "0")))].sort().reverse();
  const selMes = document.getElementById("filtro-mes");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const txtSinDatos = idiomaActual === 'en' ? 'No data' : 'Sin datos';

  selMes.innerHTML = meses.length ? meses.map(m => {
    const nombreM = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(m, idiomaActual) : (NOMBRES_MES[m] || m);
    return `<option value="${m}">${nombreM}</option>`;
  }).join("") : `<option value="">${txtSinDatos}</option>`;
  poblarJornadas();
}

function poblarJornadas() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  const jornadas = [...new Set(PARTIDAS.filter(p => p.anio == anio && String(p.mes).padStart(2,"0") === mes).map(p => p.jornada))]
    .sort((a, b) => numeroDeJornada(a) - numeroDeJornada(b));
  const selJornada = document.getElementById("filtro-jornada");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const txtTodasFechas = idiomaActual === 'en' ? 'All dates' : 'Todas las fechas';

  selJornada.innerHTML = `<option value="">${txtTodasFechas}</option>` + jornadas.map(j => `<option value="${j}">${j}</option>`).join("");
}

function obtenerMapaPartidasInvalidas(partidas) {
  const mapa = {};
  const conteoPorJornada = {};
  const ordenadas = [...partidas].sort((a, b) => claveOrden(a) - claveOrden(b));

  ordenadas.forEach(p => {
    const claveJor = claveJornada(p.anio, p.mes, p.jornada);
    if (!conteoPorJornada[claveJor]) conteoPorJornada[claveJor] = {};
    if (!mapa[p.id]) mapa[p.id] = {};

    (p.jugadores || []).forEach(j => {
      const nombreOf = resolverNombreOficial(j.nombre, EQUIVALENCIAS);
      conteoPorJornada[claveJor][nombreOf] = (conteoPorJornada[claveJor][nombreOf] || 0) + 1;
      if (conteoPorJornada[claveJor][nombreOf] > 3) {
        mapa[p.id][nombreOf] = true;
      }
    });
  });

  return mapa;
}

function render() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  const jornadaFiltro = document.getElementById("filtro-jornada").value;
  const cont = document.getElementById("lista-historial");
  const nota = document.getElementById("nota-limite");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';

  const msgSinPartidas = idiomaActual === 'en' ? 'No matches registered yet.' : 'No hay partidas registradas todavía.';
  if (!anio || !mes) {
    cont.innerHTML = `<div class="empty-state">${msgSinPartidas}</div>`;
    nota.textContent = "";
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  const delPeriodo = PARTIDAS.filter(p => p.anio == anio && String(p.mes).padStart(2, "0") === mes)
    .sort((a, b) => claveOrden(a) - claveOrden(b));

  const mapaInvalidas = obtenerMapaPartidasInvalidas(delPeriodo);
  const varsPorPartida = calcularVarPorPartida(delPeriodo, EQUIVALENCIAS);

  let filtradas = jornadaFiltro ? delPeriodo.filter(p => p.jornada === jornadaFiltro) : delPeriodo;
  filtradas = [...filtradas].sort((a, b) => claveOrden(b) - claveOrden(a));

  const nombreMes = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(mes, idiomaActual) : (NOMBRES_MES[mes] || mes);

  if (!jornadaFiltro && filtradas.length > LIMITE_PARTIDAS_DEFAULT) {
    nota.textContent = idiomaActual === 'en' 
      ? `Showing the last ${LIMITE_PARTIDAS_DEFAULT} matches of ${nombreMes} ${anio}. Select a specific Date to view the rest.`
      : `Mostrando las últimas ${LIMITE_PARTIDAS_DEFAULT} partidas de ${nombreMes} ${anio}. Selecciona una Fecha específica para ver el resto.`;
    filtradas = filtradas.slice(0, LIMITE_PARTIDAS_DEFAULT);
  } else {
    nota.textContent = "";
  }

  const msgFiltroVacio = idiomaActual === 'en' ? 'No matches for this filter.' : 'No hay partidas para este filtro.';
  if (filtradas.length === 0) {
    cont.innerHTML = `<div class="empty-state">${msgFiltroVacio}</div>`;
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  const thJugador = idiomaActual === 'en' ? 'Player' : 'Jugador';
  const thEquipo = idiomaActual === 'en' ? 'Team' : 'Equipo';
  const thCiv = idiomaActual === 'en' ? 'Civilization' : 'Civilización';
  const thVar = idiomaActual === 'en' ? 'Var' : 'Var';
  const btnDescargarText = idiomaActual === 'en' ? '📷 Download' : '📷 Descargar';
  const tagInvalidaText = idiomaActual === 'en' ? '⚠ Invalid (+3 in date)' : '⚠ Inválida (+3 en fecha)';

  cont.innerHTML = filtradas.map(p => {
    const varsDeEsta = varsPorPartida[p.id] || {};
    const invalidasEstaPartida = mapaInvalidas[p.id] || {};

    return `
    <div class="match-card" id="card-${p.id}">
      <div class="cabecera">
        <span class="titulo">${etiquetaPartida(p)}</span>
        <div class="acciones">
          <span class="dur">⏱ ${formatearDuracion(p.duracionSeg)}</span>
          <button onclick="descargarImagenPartida('${p.id}')">${btnDescargarText}</button>
        </div>
      </div>
      <table class="tabla-match">
        <thead><tr><th></th><th>${thJugador}</th><th>${thEquipo}</th><th>${thCiv}</th><th>${thVar}</th></tr></thead>
        <tbody>
          ${p.jugadores.map(j => {
            const nombreOf = resolverNombreOficial(j.nombre, EQUIVALENCIAS);
            const gano = j.resultado === "victoria";
            const v = varsDeEsta[nombreOf] ?? 0;
            const varClass = v > 0 ? "var-up" : v < 0 ? "var-down" : "";
            const varTexto = v > 0 ? `+${v}` : `${v}`;
            const esInvalida = invalidasEstaPartida[nombreOf];

            return `
              <tr>
                <td><span class="resultado-icono">${gano ? "👑" : "💀"}</span></td>
                <td>
                  <a href="jugador.html?nombre=${encodeURIComponent(nombreOf)}">${nombreOf}</a>${esInvalida ? `<span class="tag-invalida">${tagInvalidaText}</span>` : ''}
                </td>
                <td>${j.equipo || "—"}</td>
                <td>${j.civ || "—"}</td>
                <td class="${varClass}">${varTexto}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
  }).join("");
  if (typeof traducirPagina === 'function') traducirPagina();
}

function descargarImagenPartida(id) {
  const el = document.getElementById(`card-${id}`);
  descargarElementoComoImagen(el, `partida-${id}.png`, "#1c2027");
}

(async function init() {
  const datos = await cargarDatos();
  PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  poblarFiltros();
  render();
  if (typeof traducirPagina === 'function') traducirPagina();
})();
</script>
<script src="js/idiomas.js"></script>
