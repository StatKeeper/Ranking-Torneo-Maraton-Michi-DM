<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico - Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .box { background: #1e1e1e; border: 2px solid #d4af37; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-warning">🛠️ Panel de Diagnóstico</h1>
        <p class="text-muted">Si ves este texto, el archivo HTML **SÍ** se ha actualizado correctamente y el navegador lo está leyendo.</p>
        
        <div class="box">
            <h3>Estado del LocalStorage:</h3>
            <div id="diagnostico-info" class="font-monospace text-info">Analizando...</div>
        </div>

        <div class="box">
            <h3>Claves encontradas en el navegador:</h3>
            <ul id="lista-claves" class="text-white"></ul>
        </div>
        
        <a href="index.html" class="btn btn-warning fw-bold">Volver al Inicio</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let infoDiv = document.getElementById('diagnostico-info');
            let listaClaves = document.getElementById('lista-claves');
            
            let totalKeys = localStorage.length;
            let registrosEncontrados = 0;
            let htmlClaves = "";

            for (let i = 0; i < totalKeys; i++) {
                let key = localStorage.key(i);
                htmlClaves += `<li>${key}</li>`;
                if (key && key.startsWith("registros_")) {
                    registrosEncontrados++;
                }
            }

            infoDiv.innerHTML = `
                Total de elementos en localStorage: <b>${totalKeys}</b><br>
                Claves con prefijo 'registros_': <b>${registrosEncontrados}</b>
            `;

            listaClaves.innerHTML = htmlClaves || "<li>No hay ninguna clave registrada en este navegador.</li>";
        });
    </script>
</body>
</html>
