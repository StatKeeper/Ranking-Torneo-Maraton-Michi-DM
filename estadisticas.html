<script src="js/datos.js"></script>
<script>
let PARTIDAS = [], EQUIVALENCIAS = [];
let subtabActual = "tiempos";

function partidasFiltradas() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  return PARTIDAS.filter(p =>
    (anio === "" || p.anio == anio) &&
    (mes === "" || String(p.mes).padStart(2, "0") === mes)
  );
}

function poblarFiltrosPeriodo() {
  const anios = [...new Set(PARTIDAS.map(p => p.anio))].sort((a, b) => b - a);
  const selAnio = document.getElementById("filtro-anio");
  
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const textTodosAnios = idiomaActual === 'en' ? 'All years' : 'Todos los años';
  const textTodosMeses = idiomaActual === 'en' ? 'All months' : 'Todos los meses';

  selAnio.innerHTML = `<option value="">${textTodosAnios}</option>` + anios.map(a => `<option value="${a}">${a}</option>`).join("");

  const meses = [...new Set(PARTIDAS.map(p => String(p.mes).padStart(2, "0")))].sort();
  const selMes = document.getElementById("filtro-mes");
  
  selMes.innerHTML = `<option value="">${textTodosMeses}</option>` + meses.map(m => {
    const nombreM = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(m, idiomaActual) : (NOMBRES_MES[m] || m);
    return `<option value="${m}">${nombreM}</option>`;
  }).join("");

  const rerenderSiHayResultado = () => {
    if (subtabActual === "equipos") {
      renderizarEquiposGanadores();
    } else if (document.getElementById("resultado").style.display !== "none") {
      consultar();
    }
  };
  selAnio.addEventListener("change", rerenderSiHayResultado);
  selMes.addEventListener("change", rerenderSiHayResultado);
}

function cambiarSubtab(tab) {
  subtabActual = tab;
  document.querySelectorAll(".subtab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  
  const panelSel = document.getElementById("panel-seleccion-jugadores");
  const resultadoDiv = document.getElementById("resultado");
  const btnDescargar = document.getElementById("btn-descargar-stats");

  if (tab === "equipos") {
    panelSel.style.display = "none";
    resultadoDiv.style.display = "block";
    btnDescargar.style.display = "inline-block";
    renderizarEquiposGanadores();
  } else {
    panelSel.style.display = "block";
    resultadoDiv.style.display = "none";
    btnDescargar.style.display = "none";
  }
}

function renderizarEquiposGanadores() {
  const resultadoDiv = document.getElementById("resultado");
  const filtradas = partidasFiltradas();
  const equiposConteo = {};
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';

  filtradas.forEach(p => {
    if (!p.jugadores || !Array.isArray(p.jugadores)) return;
    
    const equiposGanadores = {};
    p.jugadores.forEach(j => {
      if ((j.resultado || "").toLowerCase() === "victoria") {
        const nombreOficial = resolverNombreOficial(j.nombre, EQUIVALENCIAS);
        const eq = j.equipo || "Equipo Principal";
        if (!equiposGanadores[eq]) equiposGanadores[eq] = [];
        if (!equiposGanadores[eq].includes(nombreOficial)) {
          equiposGanadores[eq].push(nombreOficial);
        }
      }
    });

    Object.values(equiposGanadores).forEach(miembros => {
      if (miembros.length !== 3 && miembros.length !== 4) return;
      
      miembros.sort();
      const equipoKey = JSON.stringify(miembros);
      
      if (!equiposConteo[equipoKey]) {
        equiposConteo[equipoKey] = { miembros, v3: 0, v4: 0, total: 0 };
      }
      
      if (miembros.length === 3) {
        equiposConteo[equipoKey].v3 += 1;
      } else if (miembros.length === 4) {
        equiposConteo[equipoKey].v4 += 1;
      }
      equiposConteo[equipoKey].total += 1;
    });
  });

  const rankingEquipos = Object.values(equiposConteo)
    .filter(datos => datos.total >= 2)
    .sort((a, b) => b.total - a.total);

  const tituloTabla = idiomaActual === 'en' ? 'Winning Teams Ranking (3v3 and 4v4)' : 'Ranking de Equipos Ganadores (3v3 y 4v4)';
  const colIntegrantes = idiomaActual === 'en' ? 'Team Members' : 'Integrantes del Equipo';
  const colV3 = idiomaActual === 'en' ? '3v3 Victories' : 'Victorias 3v3';
  const colV4 = idiomaActual === 'en' ? '4v4 Victories' : 'Victorias 4v4';
  const msgSinEquipos = idiomaActual === 'en' ? 'No 3 or 4-player teams with 2 or more joint victories for this period.' : 'No hay equipos de 3 o 4 integrantes con 2 o más victorias conjuntas para este período.';

  if (rankingEquipos.length === 0) {
    resultadoDiv.innerHTML = `
      <h3>🤝 ${tituloTabla}</h3>
      <div class="empty-state">${msgSinEquipos}</div>
    `;
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  resultadoDiv.innerHTML = `
    <h3>🤝 ${tituloTabla}</h3>
    <div style="overflow-x:auto; margin-top:12px;">
      <table class="compare-table">
        <thead>
          <tr>
            <th style="width:60px; text-align:center;">#</th>
            <th style="text-align:left;">${colIntegrantes}</th>
            <th style="width:120px; text-align:center;">${colV3}</th>
            <th style="width:120px; text-align:center;">${colV4}</th>
          </tr>
        </thead>
        <tbody>
          ${rankingEquipos.map((item, idx) => `
            <tr>
              <td style="text-align:center; font-weight:700; color:var(--gold);">${idx + 1}°</td>
              <td style="text-align:left;">
                <div class="equipo-vertical">
                  ${item.miembros.map(m => `<span>• ${m}</span>`).join("")}
                </div>
              </td>
              <td style="text-align:center; font-weight:700; color:${item.v3 > 0 ? 'var(--win)' : 'var(--text-dim)'};">${item.v3}</td>
              <td style="text-align:center; font-weight:700; color:${item.v4 > 0 ? 'var(--win)' : 'var(--text-dim)'};">${item.v4}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  if (typeof traducirPagina === 'function') traducirPagina();
}

function nombresSeleccionados() {
  return ["jug-1","jug-2","jug-3","jug-4"]
    .map(id => document.getElementById(id).value.trim())
    .filter(Boolean);
}

function consultar() {
  const nombres = nombresSeleccionados();
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  if (nombres.length < 2) { 
    alert(idiomaActual === 'en' ? 'Select at least 2 players.' : 'Selecciona al menos 2 jugadores.'); 
    return; 
  }

  const resultadoDiv = document.getElementById("resultado");
  resultadoDiv.style.display = "block";
  document.getElementById("btn-descargar-stats").style.display = "inline-block";

  if (subtabActual === "tiempos") {
    const datos = compararJugadores(nombres, partidasFiltradas(), EQUIVALENCIAS);
    const tPartidas = idiomaActual === 'en' ? 'Matches' : 'Partidas';
    const tTiempoTotal = idiomaActual === 'en' ? 'Total time' : 'Tiempo total';
    const tPromTiempo = idiomaActual === 'en' ? 'Average Total Time' : 'Promedio Tiempo Total';
    const tUnidAses = idiomaActual === 'en' ? 'Units killed' : 'Unid. asesinadas';
    const tPromUnidAses = idiomaActual === 'en' ? 'Average Units Killed' : 'Promedio Unidades Asesinadas';
    const tEdifArras = idiomaActual === 'en' ? 'Buildings destroyed' : 'Edif. arrasados';
    const tPromEdifArras = idiomaActual === 'en' ? 'Average Buildings Destroyed' : 'Promedio Edificios Arrasados';
    const tTituloTiempos = idiomaActual === 'en' ? '⏱ Time and Statistics Comparison' : '⏱ Comparativa de Tiempos y Estadísticas';
    const tMetrica = idiomaActual === 'en' ? 'Metric' : 'Métrica';

    resultadoDiv.innerHTML = `
      <h3>${tTituloTiempos}</h3>
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead><tr><th>${tMetrica}</th>${datos.map(d => `<th>${d.nombre}</th>`).join("")}</tr></thead>
          <tbody>
            <tr><td>${tPartidas}</td>${datos.map(d => `<td>${d.partidas}</td>`).join("")}</tr>
            <tr><td>${tTiempoTotal}</td>${datos.map(d => `<td>${formatearDuracion(d.segundosTotales)}</td>`).join("")}</tr>
            <tr><td>${tPromTiempo}</td>${datos.map(d => `<td>${formatearDuracion(d.partidas ? Math.round(d.segundosTotales / d.partidas) : 0)}</td>`).join("")}</tr>
            <tr><td>${tUnidAses}</td>${datos.map(d => `<td>${d.unidadesAsesinadas}</td>`).join("")}</tr>
            <tr><td>${tPromUnidAses}</td>${datos.map(d => `<td>${d.partidas ? (d.unidadesAsesinadas / d.partidas).toFixed(1) : 0}</td>`).join("")}</tr>
            <tr><td>${tEdifArras}</td>${datos.map(d => `<td>${d.edificiosArrasados}</td>`).join("")}</tr>
            <tr><td>${tPromEdifArras}</td>${datos.map(d => `<td>${d.partidas ? (d.edificiosArrasados / d.partidas).toFixed(1) : 0}</td>`).join("")}</tr>
          </tbody>
        </table>
      </div>
    `;
  }

  if (subtabActual === "civs") {
    const datos = compararJugadores(nombres, partidasFiltradas(), EQUIVALENCIAS);
    const todasLasCivs = [...new Set(datos.flatMap(d => Object.keys(d.civs)))].sort();
    const tTituloCivs = idiomaActual === 'en' ? '🏛 Civilizations Comparison' : '🏛 Comparativa de Civilizaciones';
    const msgSinCivs = idiomaActual === 'en' ? 'No civilization data for these players.' : 'No hay datos de civilización para estos jugadores.';

    if (todasLasCivs.length === 0) {
      resultadoDiv.innerHTML = `<div class="empty-state">${msgSinCivs}</div>`;
      if (typeof traducirPagina === 'function') traducirPagina();
      return;
    }
    resultadoDiv.innerHTML = `
      <h3>${tTituloCivs}</h3>
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead><tr><th>Civ</th>${datos.map(d => `<th>${d.nombre}</th>`).join("")}</tr></thead>
          <tbody>
            ${todasLasCivs.map(civ => `
              <tr>
                <td>${civ}</td>${datos.map(d => {
                  const c = d.civs[civ];
                  if (!c) return `<td>—</td>`;
                  const wr = Math.round((c.victorias / c.jugadas) * 100);
                  return `<td>${c.jugadas}p (${wr}%)</td>`;
                }).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  if (subtabActual === "sinergia") {
    const s = calcularSinergia(nombres, partidasFiltradas(), EQUIVALENCIAS);
    const tTituloSinergia = idiomaActual === 'en' ? '🤝 Group Synergy' : '🤝 Sinergia Grupal';
    const msgSinSinergia = idiomaActual === 'en' ? '⚠ These players never played together on the same team.' : '⚠ Estos jugadores nunca jugaron juntos en el mismo equipo.';
    const lblPartidasJuntos = idiomaActual === 'en' ? 'Matches together' : 'Partidas juntos';
    const lblVictorias = idiomaActual === 'en' ? 'Victories' : 'Victorias';
    const lblDerrotas = idiomaActual === 'en' ? 'Defeats' : 'Derrotas';
    const lblEfectividad = idiomaActual === 'en' ? 'Effectiveness' : 'Efectividad';

    if (s.partidasJuntos === 0) {
      resultadoDiv.innerHTML = `
        <h3>${tTituloSinergia}</h3>
        <div class="empty-state">${msgSinSinergia}</div>
      `;
      if (typeof traducirPagina === 'function') traducirPagina();
      return;
    }
    resultadoDiv.innerHTML = `
      <h3>${tTituloSinergia}</h3>
      <p class="hint">${nombres.join(", ")}</p>
      <div class="stat-grid">
        <div class="stat-tile"><span class="num">${s.partidasJuntos}</span><span class="label">${lblPartidasJuntos}</span></div>
        <div class="stat-tile"><span class="num">${s.victorias}</span><span class="label">${lblVictorias}</span></div>
        <div class="stat-tile"><span class="num">${s.derrotas}</span><span class="label">${lblDerrotas}</span></div>
        <div class="stat-tile"><span class="num">${s.efectividad}%</span><span class="label">${lblEfectividad}</span></div>
      </div>
    `;
  }
  if (typeof traducirPagina === 'function') traducirPagina();
}

function descargarImagenStats() {
  const el = document.getElementById("resultado");
  descargarElementoComoImagen(el, `estadisticas-${subtabActual}.png`, "#1c2027");
}

(async function init() {
  const datos = await cargarDatos();
  PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  poblarFiltrosPeriodo();
  document.getElementById("lista-nombres").innerHTML =
    listaDeNombresOficiales(PARTIDAS, EQUIVALENCIAS).map(n => `<option value="${n}">`).join("");
  if (typeof traducirPagina === 'function') traducirPagina();
})();
</script>
