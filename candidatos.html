<style>
  .tabla-honor { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }

<script src="js/datos.js"></script>
<script>
let JORNADAS_IMAGENES = [], CUADRO_HONOR = [];

function poblarFiltros() {
  const anios = [...new Set([...JORNADAS_IMAGENES.map(j => j.anio), ...CUADRO_HONOR.map(c => c.anio)])].sort((a, b) => b - a);
  const selAnio = document.getElementById("filtro-anio");
  selAnio.innerHTML = anios.length ? anios.map(a => `<option value="${a}">${a}</option>`).join("") : `<option value="">Sin datos</option>`;
  selAnio.addEventListener("change", () => { poblarMeses(); render(); });
  poblarMeses();
  document.getElementById("filtro-mes").addEventListener("change", render);
}

function poblarMeses() {
  const anio = document.getElementById("filtro-anio").value;
  const mesesSet = new Set([
    ...JORNADAS_IMAGENES.filter(j => j.anio == anio).map(j => String(j.mes).padStart(2, "0")),
    ...CUADRO_HONOR.filter(c => c.anio == anio).map(c => String(c.mes).padStart(2, "0"))
  ]);
  const meses = [...mesesSet].sort().reverse();
  const selMes = document.getElementById("filtro-mes");
  selMes.innerHTML = meses.length ? meses.map(m => `<option value="${m}">${NOMBRES_MES[m]}</option>`).join("") : `<option value="">Sin datos</option>`;
}

function render() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  const cont = document.getElementById("contenedor-cuadro-honor");
  const titulo = document.getElementById("titulo-cuadro-honor");

  const nombreMes = NOMBRES_MES[mes] || "";
  if (titulo) titulo.textContent = `🏆 Cuadro de Honor — ${nombreMes.toUpperCase()} ${anio}`;

  if (!anio || !mes) {
    cont.innerHTML = `<div class="empty-state">Selecciona un período.</div>`;
    return;
  }

  const delMesHonor = CUADRO_HONOR.filter(h => h.anio == anio && String(h.mes).padStart(2, "0") === mes)
    .sort((a, b) => numeroDeJornada(a.jornada) - numeroDeJornada(b.jornada));

  const delMesImgs = JORNADAS_IMAGENES.filter(j => j.anio == anio && String(j.mes).padStart(2, "0") === mes);

  if (delMesHonor.length === 0 && delMesImgs.length === 0) {
    cont.innerHTML = `<div class="empty-state">No hay registros para ${nombreMes} ${anio}.</div>`;
    return;
  }

  // Unificar combinando el cuadro de honor con las imágenes asociadas por jornada
  const jornadasMap = {};
  delMesHonor.forEach(h => {
    jornadasMap[h.jornada] = { jornada: h.jornada, jugador: h.jugador, civ: h.civ, imgEval: null, imgGal: null };
  });

  delMesImgs.forEach(j => {
    if (!jornadasMap[j.jornada]) {
      jornadasMap[j.jornada] = { jornada: j.jornada, jugador: '—', civ: '—', imgEval: null, imgGal: null };
    }
    jornadasMap[j.jornada].imgEval = j.imagenEvaluacion;
    jornadasMap[j.jornada].imgGal = j.imagenGalardon;
  });

  const listaJornadas = Object.values(jornadasMap).sort((a, b) => numeroDeJornada(a.jornada) - numeroDeJornada(b.jornada));

  cont.innerHTML = `
    <div style="overflow-x:auto;">
      <table class="tabla-honor">
        <thead>
          <tr>
            <th>Jornada</th>
            <th>Jugador de la Fecha</th>
            <th>Civilización</th>
            <th>Archivos Multimedia</th>
          </tr>
        </thead>
        <tbody>
          ${listaJornadas.map(j => `
            <tr>
              <td style="font-weight:600; color:var(--text);">${j.jornada}</td>
              <td class="ganador">👑 ${j.jugador || '—'}</td>
              <td style="color:var(--text-dim);">${j.civ || '—'}</td>
              <td>
                <div class="acciones-jornada">
                  ${j.imgEval ? `<button class="btn secondary btn-accion" onclick="abrirModal('${j.jornada} - Evaluación', '${j.imgEval}')">📋 Ver Evaluación</button>` : ''}
                  ${j.imgGal ? `<button class="btn secondary btn-accion" onclick="abrirModal('${j.jornada} - Galardón', '${j.imgGal}')">👑 Ver Galardón</button>` : ''}
                  ${!j.imgEval && !j.imgGal ? '<span style="font-size:0.75rem; color:var(--text-dim);">Sin imágenes</span>' : ''}
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function abrirModal(titulo, url) {
  document.getElementById("modal-titulo").textContent = titulo;
  document.getElementById("modal-img-src").src = url;
  document.getElementById("modal-btn-descargar").href = url;
  document.getElementById("modal-imagen").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modal-imagen").style.display = "none";
}

(async function init() {
  const datos = await cargarDatos();
  JORNADAS_IMAGENES = datos.jornadasImagenes || [];
  CUADRO_HONOR = datos.cuadroHonor || [];
  poblarFiltros();
  render();
})();
</script>
