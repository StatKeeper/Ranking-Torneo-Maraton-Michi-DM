<script src="js/datos.js"></script>
<script>
let JORNADAS_IMAGENES = [], CUADRO_HONOR = [];

function poblarFiltros() {
  const anios = [...new Set([...JORNADAS_IMAGENES.map(j => j.anio), ...CUADRO_HONOR.map(c => c.anio)])].sort((a, b) => b - a);
  const selAnio = document.getElementById("filtro-anio");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const txtSinDatos = idiomaActual === 'en' ? 'No data' : 'Sin datos';

  selAnio.innerHTML = anios.length ? anios.map(a => `<option value="${a}">${a}</option>`).join("") : `<option value="">${txtSinDatos}</option>`;
  selAnio.addEventListener("change", () => { poblarMeses(); render(); });
  poblarMeses();
  document.getElementById("filtro-mes").addEventListener("change", render);
}

function poblarMeses() {
  const anio = document.getElementById("filtro-anio").value;
  const mesesSet = new Set([
    ...JORNADAS_IMAGENES.filter(j => j.anio == anio).map(j => String(j.mes).padStart(2, "0")),
    ...CUADRO_HONOR.filter(c => c.anio == anio).map(c => String(c.mes).padStart(2, "0"))
  ]);
  const meses = [...mesesSet].sort().reverse();
  const selMes = document.getElementById("filtro-mes");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const txtSinDatos = idiomaActual === 'en' ? 'No data' : 'Sin datos';

  selMes.innerHTML = meses.length ? meses.map(m => {
    const nombreM = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(m, idiomaActual) : (NOMBRES_MES[m] || m);
    return `<option value="${m}">${nombreM}</option>`;
  }).join("") : `<option value="">${txtSinDatos}</option>`;
}

function render() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  const cont = document.getElementById("contenedor-cuadro-honor");
  const titulo = document.getElementById("titulo-cuadro-honor");
  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';

  const nombreMes = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(mes, idiomaActual) : (NOMBRES_MES[mes] || "");
  const tituloHonor = idiomaActual === 'en' ? '🏆 Monthly Honor Roll' : '🏆 Cuadro de Honor Mensual';
  if (titulo) titulo.textContent = `${tituloHonor} — ${nombreMes.toUpperCase()} ${anio}`;

  const msgSelPeriodo = idiomaActual === 'en' ? 'Select a period.' : 'Selecciona un período.';
  if (!anio || !mes) {
    cont.innerHTML = `<div class="empty-state">${msgSelPeriodo}</div>`;
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  const delMesHonor = CUADRO_HONOR.filter(h => h.anio == anio && String(h.mes).padStart(2, "0") === mes)
    .sort((a, b) => numeroDeJornada(a.jornada) - numeroDeJornada(b.jornada));

  const delMesImgs = JORNADAS_IMAGENES.filter(j => j.anio == anio && String(j.mes).padStart(2, "0") === mes);

  const msgSinRegistros = idiomaActual === 'en' ? `No records for ${nombreMes} ${anio}.` : `No hay registros para ${nombreMes} ${anio}.`;
  if (delMesHonor.length === 0 && delMesImgs.length === 0) {
    cont.innerHTML = `<div class="empty-state">${msgSinRegistros}</div>`;
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  const jornadasMap = {};

  delMesImgs.forEach(j => {
    jornadasMap[j.jornada] = {
      jornada: j.jornada,
      jugador: '—',
      civ: '—',
      imgEval: j.evaluacion || j.imagenCandidatos || j.imagenEvaluacion || null,
      imgGal: j.galardon || j.imagenGalardon || null
    };
  });

  delMesHonor.forEach(h => {
    if (!jornadasMap[h.jornada]) {
      jornadasMap[h.jornada] = { jornada: h.jornada, jugador: h.jugador, civ: h.civ, imgEval: null, imgGal: null };
    } else {
      jornadasMap[h.jornada].jugador = h.jugador;
      jornadasMap[h.jornada].civ = h.civ;
    }
  });

  const listaJornadas = Object.values(jornadasMap).sort((a, b) => numeroDeJornada(a.jornada) - numeroDeJornada(b.jornada));
  
  const thJornada = idiomaActual === 'en' ? 'Round' : 'Jornada';
  const thJugadorFecha = idiomaActual === 'en' ? 'Player of the Round' : 'Jugador de la Fecha';
  const thCiv = idiomaActual === 'en' ? 'Civilization' : 'Civilización';
  const thMultimedia = idiomaActual === 'en' ? 'Multimedia Files' : 'Archivos Multimedia';
  const txtVerEvaluacion = idiomaActual === 'en' ? '📋 View Evaluation' : '📋 Ver Evaluación';
  const txtVerGalardon = idiomaActual === 'en' ? '👑 View Award' : '👑 Ver Galardón';
  const txtSinImagenes = idiomaActual === 'en' ? 'No images' : 'Sin imágenes';

  cont.innerHTML = `
    <div style="overflow-x:auto;">
      <table class="tabla-honor">
        <thead>
          <tr>
            <th>${thJornada}</th>
            <th>${thJugadorFecha}</th>
            <th>${thCiv}</th>
            <th>${thMultimedia}</th>
          </tr>
        </thead>
        <tbody>
          ${listaJornadas.map(j => `
            <tr>
              <td style="font-weight:600; color:var(--text);">${j.jornada}</td>
              <td class="ganador">👑 ${j.jugador || '—'}</td>
              <td style="color:var(--text-dim);">${j.civ || '—'}</td>
              <td>
                <div class="acciones-jornada">
                  ${j.imgEval ? `<button class="btn secondary btn-accion" onclick="abrirModal('${j.jornada} - ${idiomaActual === 'en' ? 'Evaluation' : 'Evaluación'}', '${j.imgEval}')">${txtVerEvaluacion}</button>` : ''}
                  ${j.imgGal ? `<button class="btn secondary btn-accion" onclick="abrirModal('${j.jornada} - ${idiomaActual === 'en' ? 'Award' : 'Galardón'}', '${j.imgGal}')">${txtVerGalardon}</button>` : ''}
                  ${!j.imgEval && !j.imgGal ? `<span style="font-size:0.75rem; color:var(--text-dim);">${txtSinImagenes}</span>` : ''}
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  if (typeof traducirPagina === 'function') traducirPagina();
}

function abrirModal(titulo, url) {
  document.getElementById("modal-titulo").textContent = titulo;
  document.getElementById("modal-img-src").src = url;
  document.getElementById("modal-btn-descargar").href = url;
  document.getElementById("modal-imagen").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modal-imagen").style.display = "none";
}

(async function init() {
  const datos = await cargarDatos();
  JORNADAS_IMAGENES = datos.jornadasImagenes || [];
  CUADRO_HONOR = datos.cuadroHonor || [];
  poblarFiltros();
  render();
  if (typeof traducirPagina === 'function') traducirPagina();
})();
</script>
<script src="js/idiomas.js"></script>
