<script>
async function initInicio() {
  const datos = await cargarDatos();
  const jornadasImgs = datos.jornadasImagenes || [];
  const cont = document.getElementById("contenedor-inicio");
  const idiomaActual = localStorage.getItem('idioma_sitio') || 'es';

  if (jornadasImgs.length === 0) {
    cont.innerHTML = `<div class="empty-state">${idiomaActual === 'en' ? 'No recent matches or awards registered.' : 'No hay partidas ni galardones recientes registrados.'}</div>`;
    return;
  }

  // Ordenar para obtener la última jornada con imagen de galardón configurada
  const ultimas = [...jornadasImgs].reverse();
  const ultimaConImg = ultimas.find(j => j.galardon || j.imagenGalardon);

  if (!ultimaConImg) {
    cont.innerHTML = `<div class="empty-state">${idiomaActual === 'en' ? 'No awards banner available.' : 'No hay banner de galardón disponible.'}</div>`;
    return;
  }

  const imgGal = ultimaConImg.galardon || ultimaConImg.imagenGalardon;
  const nombreMes = (typeof NOMBRES_MES_IDIOMA === 'function') ? NOMBRES_MES_IDIOMA(ultimaConImg.mes, idiomaActual) : (NOMBRES_MES[ultimaConImg.mes] || "");

  cont.innerHTML = `
    <div class="card-wrapper" id="card-galardon-reciente">
      <img src="${imgGal}" alt="Galardón reciente">
      <div style="font-size:0.8rem; color:var(--text-dim); margin-top:4px;">
        👑 ${ultimaConImg.jornada} &nbsp;|&nbsp; ${nombreMes} ${ultimaConImg.anio}
      </div>
    </div>
  `;
  if (typeof traducirPagina === 'function') traducirPagina();
}

function cerrarModal() {
  document.getElementById("modal-imagen").style.display = "none";
}

document.addEventListener("DOMContentLoaded", () => {
  initInicio();
});
</script>
