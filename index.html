<script src="js/datos.js"></script>
<script>
(async function init() {
  const datos = await cargarDatos();
  const cont = document.getElementById("contenedor-galardon");

  const lista = datos.jornadasImagenes || [];
  const conGalardon = lista
    .map(j => ({ ...j, urlGalardon: j.imagenGalardon || j.galardon }))
    .filter(j => j.urlGalardon);

  if (conGalardon.length === 0) {
    cont.innerHTML = `<div class="empty-state" data-i18n="sin_galardon">Todavía no se ha publicado ningún galardón.</div>`;
    if (typeof traducirPagina === 'function') traducirPagina();
    return;
  }

  conGalardon.sort((a, b) =>
    claveOrden({ anio: b.anio, mes: b.mes, jornada: b.jornada, numeroPartida: 0 }) -
    claveOrden({ anio: a.anio, mes: a.mes, jornada: a.jornada, numeroPartida: 0 })
  );
  const ultima = conGalardon[0];

  const idiomaActual = localStorage.getItem('idioma_torneo') || 'es';
  const nombreMes = (typeof NOMBRES_MES_IDIOMA === 'function') 
    ? NOMBRES_MES_IDIOMA(ultima.mes, idiomaActual) 
    : (NOMBRES_MES[ultima.mes] || ultima.mes);

  cont.innerHTML = `
    <img src="${ultima.urlGalardon}" alt="Galardón ${ultima.jornada}">
    <div class="etiqueta">👑 ${ultima.jornada}</div>
    <div class="subetiqueta">${nombreMes} ${ultima.anio}</div>
  `;
  
  if (typeof traducirPagina === 'function') traducirPagina();
})();
</script>
