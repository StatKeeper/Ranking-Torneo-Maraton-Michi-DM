<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificación y Ranking — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f8f6f0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* Estilos para los estados de Último Suceso */
  .suceso-victoria {
    color: var(--win);
    font-weight: 600;
  }
  .suceso-derrota {
    color: var(--loss);
    background-color: rgba(180, 50, 50, 0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    display: inline-block;
  }
  .suceso-neutro {
    color: var(--text);
    font-weight: 400;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="sub">Clasificación y Ranking</span></div>
  <nav class="tabs">
    <a href="index.html">Inicio</a>
    <a href="clasificacion.html" class="active">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="panel" id="seccion-tabla-posiciones">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:0.95rem; color:var(--gold); margin:0;">Tabla de Posiciones</h3>
      <button class="btn secondary" style="font-size:0.75rem; padding:4px 8px;" onclick="descargarTablaPosiciones()">📷 Descargar Imagen</button>
    </div>
    <div class="filters" style="margin-bottom:12px;">
      <select id="filtro-anio"></select>
      <select id="filtro-mes"></select>
      <select id="filtro-jornada"><option value="">Todo el mes (acumulado)</option></select>
    </div>
    <div id="info-jornada" style="font-size:0.85rem; color:var(--gold); margin-bottom:8px; font-weight:600;"></div>
    <div style="overflow-x:auto;">
      <table id="tabla-clasificacion">
        <thead>
          <tr>
            <th>Pos</th><th>Var</th><th>Jugador</th><th>Pts</th><th>V/PJ</th><th>Último Suceso</th><th>V/D</th><th>E</th><th>R</th><th>M</th><th>O</th><th>S</th><th>Rch</th><th>MG</th><th>RLP</th><th>TB</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-clasificacion">
          <tr><td colspan="16" class="empty-state">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="seccion-cuadro-honor" style="margin-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="titulo-cuadro-honor" style="font-size:0.95rem; color:var(--gold); margin:0;">🏆 Cuadro de Honor Mensual</h3>
      <button class="btn secondary" style="font-size:0.75rem; padding:4px 8px;" onclick="descargarCuadroHonor()">📷 Descargar Imagen</button>
    </div>
    <div id="contenedor-cuadro-honor"><div class="empty-state">Cargando...</div></div>
  </div>

  <div class="panel" id="seccion-grand-prix" style="margin-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="titulo-grand-prix" style="font-size:0.95rem; color:var(--gold); margin:0;">🏆 Grand Prix Anual</h3>
      <button class="btn secondary" style="font-size:0.75rem; padding:4px 8px;" onclick="descargarGrandPrix()">📷 Descargar Imagen</button>
    </div>
    <div id="contenedor-grand-prix"><div class="empty-state">Cargando Grand Prix...</div></div>
  </div>
</main>

<script src="js/datos.js"></script>
<script>
let PARTIDAS = [], EQUIVALENCIAS = [], JUGADORES_INFO = {}, CUADRO_HONOR = [];

async function iniciarPagina() {
  try {
    if (typeof cargarDatos === 'function') {
      const datos = await cargarDatos();
      PARTIDAS = datos.partidas || [];
      EQUIVALENCIAS = datos.equivalencias || [];
      JUGADORES_INFO = datos.jugadoresInfo || {};
      CUADRO_HONOR = datos.cuadroHonor || [];
    }

    const anios = [...new Set(PARTIDAS.map(p => p.anio))].sort((a, b) => b - a);
    const selAnio = document.getElementById("filtro-anio");
    selAnio.innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join("");

    actualizarMeses();

    selAnio.addEventListener("change", () => { actualizarMeses(); renderizarTodo(); });
    document.getElementById("filtro-mes").addEventListener("change", () => { renderizarTodo(); });
    document.getElementById("filtro-jornada").addEventListener("change", () => { renderizarTodo(); });

    renderizarTodo();

  } catch (error) {
    console.error("Error al iniciar:", error);
  }
}

function actualizarMeses() {
  const anio = document.getElementById("filtro-anio").value;
  const meses = [...new Set(PARTIDAS.filter(p => p.anio == anio).map(p => String(p.mes).padStart(2, "0")))].sort().reverse();
  const selMes = document.getElementById("filtro-mes");
  selMes.innerHTML = meses.map(m => `<option value="${m}">${NOMBRES_MES[m] || m}</option>`).join("");
}

function renderizarTodo() {
  const anio = document.getElementById("filtro-anio").value;
  const mes = document.getElementById("filtro-mes").value;
  const jornada = document.getElementById("filtro-jornada").value;

  // 1. Renderizar Tabla de Posiciones
  const { filas } = calcularTablaClasificacion(PARTIDAS, EQUIVALENCIAS, anio, mes, jornada, "");
  const tbody = document.getElementById("cuerpo-tabla-clasificacion");
  
  if (filas.length > 0) {
    tbody.innerHTML = filas.map((f, idx) => {
      let sucesoHtml = f.ultimoSuceso || "Sin participación";
      if (sucesoHtml.toLowerCase().includes("derrota")) {
        sucesoHtml = `<span class="suceso-derrota">${sucesoHtml}</span>`;
      } else if (sucesoHtml.toLowerCase().includes("victoria") || sucesoHtml.toLowerCase().includes("bono") || sucesoHtml.toLowerCase().includes("+")) {
        sucesoHtml = `<span class="suceso-victoria">${sucesoHtml}</span>`;
      } else {
        sucesoHtml = `<span class="suceso-neutro">${sucesoHtml}</span>`;
      }

      return `
        <tr>
          <td class="num">${idx + 1}</td>
          <td class="num">0</td>
          <td><a href="jugador.html?nombre=${encodeURIComponent(f.nombre)}">${f.nombre}</a></td>
          <td class="num" style="font-weight:700; color:var(--gold);">${f.puntos}</td>
          <td class="num">${f.victorias}/${f.partidas}</td>
          <td>${sucesoHtml}</td>
          <td class="num">${f.vd}</td>
          <td class="num">${f.bonos.E}</td>
          <td class="num">${f.bonos.R}</td>
          <td class="num">${f.bonos.M}</td>
          <td class="num">${f.bonos.O}</td>
          <td class="num">${f.bonos.S}</td>
          <td class="num">${f.bonos.Rch}</td>
          <td class="num">${f.bonos.MG}</td>
          <td class="num">${f.bonos.RLP}</td>
          <td class="num" style="font-weight:700;">${f.tb}</td>
        </tr>
      `;
    }).join("");
  } else {
    tbody.innerHTML = `<tr><td colspan="16" class="empty-state">No hay registros para este período.</td></tr>`;
  }

  // 2. Renderizar Cuadro de Honor
  const tituloHonor = document.getElementById("titulo-cuadro-honor");
  const contHonor = document.getElementById("contenedor-cuadro-honor");
  const nombreMes = NOMBRES_MES[mes] || "";
  tituloHonor.textContent = `🏆 Cuadro de Honor — ${nombreMes.toUpperCase()} ${anio}`;

  const delMes = CUADRO_HONOR.filter(h => h.anio == anio && String(h.mes).padStart(2, "0") === mes)
    .sort((a, b) => numeroDeJornada(a.jornada) - numeroDeJornada(b.jornada));

  if (delMes.length === 0) {
    contHonor.innerHTML = `<div class="empty-state">No hay cuadro de honor registrado para ${nombreMes} ${anio}.</div>`;
  } else {
    contHonor.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
          <thead>
            <tr>
              <th style="padding:10px; border-bottom:1px solid var(--line); text-align:left; color:var(--gold);">Jornada</th>
              <th style="padding:10px; border-bottom:1px solid var(--line); text-align:left; color:var(--gold);">Jugador de la Fecha</th>
              <th style="padding:10px; border-bottom:1px solid var(--line); text-align:left; color:var(--gold);">Civilización</th>
            </tr>
          </thead>
          <tbody>
            ${delMes.map(h => `
              <tr>
                <td style="padding:10px; border-bottom:1px solid var(--line); font-weight:600;">${h.jornada}</td>
                <td style="padding:10px; border-bottom:1px solid var(--line); font-weight:700; color:var(--win);">👑 <a href="jugador.html?nombre=${encodeURIComponent(h.jugador)}">${h.jugador}</a></td>
                <td style="padding:10px; border-bottom:1px solid var(--line); color:var(--text-dim);">${h.civ || '—'}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  // 3. Renderizar Grand Prix Anual
  const contGP = document.getElementById("contenedor-grand-prix");
  document.getElementById("titulo-grand-prix").textContent = `🏆 Grand Prix Ranking Maratón Michi DM ${anio}`;
  
  if (typeof calcularGrandPrixAnual === 'function') {
    const { meses: mesesGP, rankingGP } = calcularGrandPrixAnual(PARTIDAS, EQUIVALENCIAS, anio);
    if (rankingGP.length === 0) {
      contGP.innerHTML = `<div class="empty-state">No hay datos de Grand Prix para el año ${anio}.</div>`;
    } else {
      contGP.innerHTML = `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Posición</th>
                <th>Var</th>
                <th>Jugador</th>
                ${mesesGP.map(m => `<th>${NOMBRES_MES[m]}</th>`).join("")}
                <th>Acumulado</th>
              </tr>
            </thead>
            <tbody>
              ${rankingGP.map((item, idx) => `
                <tr>
                  <td class="num" style="font-weight:700; color:var(--gold);">${idx + 1}</td>
                  <td class="num">0</td>
                  <td><a href="jugador.html?nombre=${encodeURIComponent(item.nombre)}">${item.nombre}</a></td>
                  ${mesesGP.map(m => `<td class="num">${item.puntosPorMes[m] || 0}</td>`).join("")}
                  <td class="num" style="font-weight:700; color:var(--win);">${item.total}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
  }
}

function descargarTablaPosiciones() {
  descargarElementoComoImagen(document.getElementById("seccion-tabla-posiciones"), "tabla-posiciones.png", "#f8f6f0");
}
function descargarCuadroHonor() {
  descargarElementoComoImagen(document.getElementById("seccion-cuadro-honor"), "cuadro-honor.png", "#f8f6f0");
}
function descargarGrandPrix() {
  descargarElementoComoImagen(document.getElementById("seccion-grand-prix"), "grand-prix.png", "#f8f6f0");
}

window.addEventListener("DOMContentLoaded", iniciarPagina);
</script>
</body>
</html>
